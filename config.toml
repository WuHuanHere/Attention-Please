[privacy]
# 分心时把"屏幕截图 + 摄像头画面"拼成一张图保存(便于事后调参)
save_captures = true
# 同时存原始摄像头帧(单独目录), 仅调参时有用
save_raw_camera_frame = false
# 自动清理天数
capture_retention_days = 7
# 截图缩放后的宽度(越小越省空间, 拼接图高度按比例)
capture_width = 960

[report]
# 每天生成 markdown 日报并弹一次托盘总结
daily_report = true
report_time = "21:30"
report_dir = "data/reports"
