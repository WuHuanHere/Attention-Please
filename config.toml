[reminder]
# 可信度分级: high=窗口标题命中黑名单, mid=看手机推断, low=发呆推断
# 每一级最大升级档位: 1=单声  2=三声  3=循环+置顶弹窗
max_level_high = 3
max_level_mid = 2
max_level_low = 1
# 升级阶梯: **首次提醒之后**经过这些秒数就升一档(不是从信号出现算起)
escalate_after = [0, 10, 30]
# 同一次分心结束后, 同原因多少秒内不重复提醒
cooldown_seconds = 180
# 静默上限: 一次分心**连续**超过这么久还没出过声, 就强行提醒一次。
# 冷却的锚点是"上一次真的响过的时刻"(不是上一次分心结束), 否则一集接一集地切窗口
# 会把冷却无限顺延 —— 实测出现过"连续 109 秒、甚至 18 分钟一声不吭"。
# 想更灵敏就调小(比如 60), 想更安静就调大。
max_silent_episode_seconds = 90
# 点了"判定错了"之后, 该信号静默多久
wrong_feedback_mute_seconds = 900
# 提醒窗口显示判定证据(建议保持 true: 误报时你能知道它凭什么)
show_evidence = true

[quiet_hours]
# 安静时段: 不发声, 只弹窗。18:00 后家里有人
enabled = true
ranges = ["18:00-24:00"]

[detection]
# 启用哪些信号。screen=切到娱乐窗口; phone=看手机(头右偏, 手机在右手边); daze=发呆(暂不建议开)
# 2026-09-18 中午起: screen + phone。保存后一分钟内热重载生效。
enabled_signals = ["screen", "phone"]
# 低于该置信度的判定一律只记录不报警(宁可漏报, 你说了误报最烦)
# 切到娱乐窗口: 连续多少秒才提醒
screen_continuous_seconds = 10
# 看手机(头右偏): 连续多少秒才提醒。**2026-09-18 从 25 秒调到 15 秒** ——
phone_continuous_seconds = 15
# 回一条消息通常 20-40 秒, 25 秒会漏掉; 15 秒能抓住。觉得太敏感就往上调。
# 发呆: 头部姿态几乎不变持续多少秒才提醒(默认 4 分钟)
daze_continuous_seconds = 240
# 发呆的头姿稳定性判据: 窗口内 pitch/yaw 标准差小于该值(度)才算"没动"
daze_yaw_std_deg = 3.0
daze_pitch_std_deg = 3.0
# 发呆的眨眼判据: 相对校准基线的眨眼率下降比例
daze_blink_drop_ratio = 0.5
# 离开: Pose 丢失多少秒后开始记为"离开"(只记录不报警)
away_seconds = 90
# 离开**太久**才提醒一次(秒)。0 = 关闭。
# 级别上限是"低"(1 声), 所以一次离开只会提醒一次, 不会连环叫;
# 安静时段(18:00 后)自动变成只弹窗。上个厕所不该被念, 跑去躺着就该。
away_reminder_seconds = 900
# 人回来了多久才重新开始判定(防止刚坐下就被念)
resume_grace_seconds = 20

