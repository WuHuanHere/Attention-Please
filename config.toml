# attention_please 配置(手改这个文件即可, 程序不会覆盖它)
# 校准结果写在 calibration.json, 事件与日报写在 data/, 分心截图写在 captures/
# 改完保存即生效(程序每分钟重读一次配置)

[general]
# 用 scripts\pick_camera.py 逐个预览后确认(人眼确认, 别靠自动判据)
# 实测本机三个设备: 0 = 真 RGB 摄像头(可用)  1 = 红外灰度  2 = OBS 虚拟摄像头(静帧)
# 注意: 索引 0 画面饱和度只有 ~28, 房间偏暗 -> 开灯能让姿态/人脸检出率明显变好
camera_index = 0
# 检测频率(帧/秒)。M0 实测: 640x480 下 Pose+Face 全跑能到 21 fps、CPU 约 32% 单核, 所以 5 很宽裕
tick_hz = 5
# 采集分辨率。**不要降到 640x480**: 实测那个分辨率下人脸检出率是 0%,
# "看手机"和"发呆"两个信号会直接失效。720p + Pose 裁头 = 你正常坐姿 100% 检出。
camera_width = 1280
camera_height = 720
# 时间表内自动进入监控。关掉则只能手动"开始学习"
auto_monitor_in_schedule = true
# 单实例: 已经在跑就不再开第二个
single_instance = true

[schedule]
# 时间表外一律待机(不判定不记录), 但托盘可以手动"现在开始学习"
# kind: focus = 监控; 其余时间自动算休息
# allow_phone: 该时段"看手机"只记录不报警(背单词等)
[[schedule.block]]
name = "高数强化听课"
start = "08:30"
